name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so only the latest push is graded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows-only or Linux-only break must stay visible even when the other
      # OS is green — that divergence is the entire reason [R:xplat-fixtures]
      # exists, so one OS failing must never cancel the other's evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rustfmt
        run: cargo fmt --check
      # --all-targets so the test and fixture code — where [R:xplat-fixtures]
      # breakage lives — is linted too, not only lib + bins.
      - name: clippy (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      # The gate the ledger claims. Invoked BARE — no --targets, no --out —
      # because the default path through a control is the one that has to work:
      # a gate whose green invocation needs a flag teaches every reader that the
      # bare command is noisy and trains them to reach for the flag. This step
      # is what makes FEATURES.md's "CI gate" row name a real invocation rather
      # than an artefact that would catch drift if someone ran it correctly.
      - name: verify (generated tree in sync with rules)
        run: cargo run --quiet -- verify
      # `copilot-pack/` is a second emission of the copilot target, committed so
      # the folder can be downloaded and dropped into another repository whole.
      # It lives outside every relearn-owned path, so the bare `verify` above
      # cannot see it — without this step a rule change would rebuild the root
      # artefacts and leave the pack silently stale, which is the distributed
      # copy going stale that `[R:doc-currency]` names. Flags are unavoidable
      # here: they are what addresses the second output root.
      - name: verify (copilot-pack in sync with rules)
        run: cargo run --quiet -- verify --targets copilot --out copilot-pack
      # The advisory linter. Deliberately `--deny error`, not bare: `lint`'s own
      # module doc says findings are "reported, never acted on — input to a human
      # cut-list decision", and `UnheldRecurrence` is the first finding that is
      # legitimately long-lived, because clearing it means promoting a rule to a
      # stronger control, which may be work in another repository entirely.
      # Blocking on it would leave `main` permanently red, and an always-red
      # check is a muted check (`[R:xplat-fixtures]`). Every finding is still
      # printed in the log at any threshold — this makes warnings non-fatal, it
      # never hides them. An `Error` finding (two rules colliding on one output
      # file) still fails the build, because that one does make the emitted tree
      # wrong. The bare default remains `--deny warning` for local use.
      - name: lint (rule library; errors fail, warnings reported)
        run: cargo run --quiet -- lint --deny error
