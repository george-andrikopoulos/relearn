<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">A new project in four prompts</title>
  <desc id="d">Four steps. You describe the project. The model chooses the rules that fit. The model writes the five project documents, with no code yet. You approve the milestones. Then each milestone is planned, coded with its test, shown passing, documented and ticked off.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .panel { fill: #ffffff; stroke: #d0d7de; }
    .card  { fill: #f6f8fa; stroke: #d0d7de; }
    .band  { fill: #eef7f3; stroke: #bfe0d3; }
    .chip  { fill: #ffffff; stroke: #9fd1bf; }
    .h  { font-size: 17px; font-weight: 700; fill: #1f2328; }
    .k  { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; }
    .b  { font-size: 14px; fill: #3d444d; }
    .bl { font-size: 15px; font-weight: 700; fill: #1f2328; }
    .c  { font-size: 14px; fill: #1f2328; }
    .sep { font-size: 18px; fill: #8c959f; }
    .arrow { stroke: #8c959f; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .you   { fill: #3366cc; }
    .model { fill: #1f8a70; }
    .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #30363d; }
      .card  { fill: #161b22; stroke: #30363d; }
      .band  { fill: #102620; stroke: #1f4d3f; }
      .chip  { fill: #0d1117; stroke: #2f6f5b; }
      .h, .bl, .c { fill: #e6edf3; }
      .b  { fill: #b1bac4; }
      .sep { fill: #6e7681; }
      .arrow { stroke: #6e7681; }
      .you { fill: #6e9be8; }
      .model { fill: #3fb68f; }
      .num { fill: #0d1117; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="959" height="299" rx="16"/>

  <!-- 1: describe it -->
  <rect class="card" x="24" y="24" width="210" height="172" rx="12"/>
  <circle class="you" cx="60" cy="60" r="16"/>
  <text class="num" x="60" y="65.5" text-anchor="middle">1</text>
  <text class="k you" x="86" y="65">YOU</text>
  <text class="h" x="44" y="106">Describe it</text>
  <g class="b">
    <text x="44" y="134">What it does, its scale,</text>
    <text x="44" y="154">how it is put together,</text>
    <text x="44" y="174">and what is out of scope.</text>
  </g>

  <path class="arrow" d="M242 102 L250 110 L242 118"/>

  <!-- 2: rules chosen -->
  <rect class="card" x="258" y="24" width="210" height="172" rx="12"/>
  <circle class="model" cx="294" cy="60" r="16"/>
  <text class="num" x="294" y="65.5" text-anchor="middle">2</text>
  <text class="k model" x="320" y="65">THE MODEL</text>
  <text class="h" x="278" y="106">Chooses the rules</text>
  <g class="b">
    <text x="278" y="134">Picks the rules that fit</text>
    <text x="278" y="154">and names each by tag.</text>
    <text x="278" y="174">You approve the choice.</text>
  </g>

  <path class="arrow" d="M476 102 L484 110 L476 118"/>

  <!-- 3: five documents -->
  <rect class="card" x="492" y="24" width="210" height="172" rx="12"/>
  <circle class="model" cx="528" cy="60" r="16"/>
  <text class="num" x="528" y="65.5" text-anchor="middle">3</text>
  <text class="k model" x="554" y="65">THE MODEL</text>
  <text class="h" x="512" y="106">Writes the plan</text>
  <g class="b">
    <text x="512" y="134">The five project files,</text>
    <text x="512" y="154">from README to TODO.</text>
    <text x="512" y="174">No code yet.</text>
  </g>

  <path class="arrow" d="M710 102 L718 110 L710 118"/>

  <!-- 4: milestones -->
  <rect class="card" x="726" y="24" width="210" height="172" rx="12"/>
  <circle class="you" cx="762" cy="60" r="16"/>
  <text class="num" x="762" y="65.5" text-anchor="middle">4</text>
  <text class="k you" x="788" y="65">YOU</text>
  <text class="h" x="746" y="106">The milestones</text>
  <g class="b">
    <text x="746" y="134">Reorder, merge or cut</text>
    <text x="746" y="154">the steps it proposes.</text>
    <text x="746" y="174">Then the building starts.</text>
  </g>

  <!-- Band: each milestone -->
  <rect class="band" x="24" y="216" width="912" height="60" rx="12"/>
  <text class="bl" x="44" y="251">Each milestone</text>
  <rect class="chip" x="176" y="229" width="134" height="34" rx="17"/>
  <text class="c" x="243" y="251" text-anchor="middle">Plan the steps</text>
  <text class="sep" x="320" y="252" text-anchor="middle">›</text>
  <rect class="chip" x="330" y="229" width="134" height="34" rx="17"/>
  <text class="c" x="397" y="251" text-anchor="middle">Code + its test</text>
  <text class="sep" x="474" y="252" text-anchor="middle">›</text>
  <rect class="chip" x="484" y="229" width="134" height="34" rx="17"/>
  <text class="c" x="551" y="251" text-anchor="middle">Show it passing</text>
  <text class="sep" x="628" y="252" text-anchor="middle">›</text>
  <rect class="chip" x="638" y="229" width="134" height="34" rx="17"/>
  <text class="c" x="705" y="251" text-anchor="middle">Update the docs</text>
  <text class="sep" x="782" y="252" text-anchor="middle">›</text>
  <rect class="chip" x="792" y="229" width="134" height="34" rx="17"/>
  <text class="c" x="859" y="251" text-anchor="middle">Tick it off</text>
</svg>
