# controls.toml — where each control named in rules/*.md lives.
#
# A `partial` or `graduated` rule names its controls by kind and name
# (`hook:no-anyhow-in-lib`). That text does not say which repository holds the
# artefact, or where in it; this file does, one entry per control, so the rule
# format stays exactly as it was (ARCHITECTURE.md decisions log, 2026-10-30).
#
#   relearn controls [--root <name>=<path>]... [--settings <settings.json>]
#
# `here` is the root this file sits in, located from the file's own path. Every
# other root is supplied on the command line; one that is not reads UNCHECKABLE
# and the run exits 2, never 0.
#
# Per entry: `control` is exactly one `kind:name`, without its coverage note.
# `path` is relative to the root, `/`-separated, `.` for the root itself.
#   hook      -> `path` is the script; wired when --settings registers it.
#   test      -> `path` is a .rs file (wired: it holds a running #[test]), or,
#                with `function`, a file or directory searched for `fn <name>`
#                (wired: #[test] and no #[ignore]).
#   gate      -> `path` is the script, `invoked_by` the file that runs it, and
#                optionally `function`, a shell function inside the script.
#   type      -> no resolver; leave unmapped, and it reads UNCHECKABLE.
#
# `relearn controls` fails when a rule names a control this file does not place
# (UNMAPPED) and when this file places one no rule names (STALE_MAP_ENTRY).

here = "relearn"

# --- this repository -------------------------------------------------------

[[control]]
control = "test:tests/ledger.rs::every_enforced_by_row_names_an_artefact_or_declares_itself_exposed"
root = "relearn"
path = "tests/ledger.rs"
function = "every_enforced_by_row_names_an_artefact_or_declares_itself_exposed"

[[control]]
control = "test:tests/pack_counts.rs"
root = "relearn"
path = "tests/pack_counts.rs"

[[control]]
control = "gate:scripts/no-float-money.sh"
root = "relearn"
path = "scripts/no-float-money.sh"
invoked_by = "scripts/check.sh"

