[package]
name = "relearn"
version = "0.1.0"
edition = "2024"
description = "Compile correction-derived rules from one neutral source form to every AI assistant's native instruction layer."
license = "Apache-2.0"
repository = "https://github.com/george-andrikopoulos/relearn"
readme = "README.md"

[lib]
name = "relearn"
path = "src/lib.rs"

[[bin]]
name = "relearn"
path = "src/main.rs"

[dependencies]
# Neutral rule format: TOML front-matter. The `toml` crate is well maintained;
# YAML's Rust ecosystem is fragmented (ARCHITECTURE decisions log, 2026-08-13).
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# CLI (`cli` module).
clap = { version = "4", features = ["derive"] }
# Library errors are typed enums (rust-typedd Pattern 7).
thiserror = "2"
# `anyhow` is permitted at the binary edge ONLY — never in library return types.
anyhow = "1"
# Generated-file guard: content hash in the generated-by header.
sha2 = "0.10"

[dev-dependencies]
# Property tests carry behavioural laws (rust-typedd hierarchy, tier 2).
proptest = "1"
